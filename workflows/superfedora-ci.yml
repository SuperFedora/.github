# Reusable @SuperFedora Organization CI Workflow: House Laws + Static musl Rust Builds
name: SuperFedora Organization CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  house-laws:
    name: House Laws & Page Rules Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify AGENTS.md, LICENSE, VERSION, and Page Rules
        run: |
          test -f AGENTS.md
          test -f LICENSE
          test -f VERSION
          if [ -f tests/test_page_rules.py ]; then
            python3 tests/test_page_rules.py
          fi

  rust-musl:
    name: Static musl Rust Binary Build
    runs-on: ubuntu-latest
    if: hashFiles('Cargo.toml') != ''
    steps:
      - uses: actions/checkout@v4
      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install Rust toolchain (x86_64-unknown-linux-musl)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Build release binaries
        run: cargo build --release --target x86_64-unknown-linux-musl
